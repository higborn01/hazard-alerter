name: Daily Forecast

on:
  schedule:
    # ~7:00 AM US Eastern (drifts to 6/7 AM across DST changes)
    - cron: "0 11 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python daily_forecast.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
