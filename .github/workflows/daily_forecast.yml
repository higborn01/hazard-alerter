name: Daily Forecast

on:
  schedule:
    # ~7:00 AM US Eastern (drifts to 6/7 AM across DST changes)
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      latitude:
        description: "Phone's current latitude (optional -- replaces the NJ slot)"
        required: false
        type: string
      longitude:
        description: "Phone's current longitude (optional -- replaces the NJ slot)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python daily_forecast.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PHONE_LAT: ${{ github.event.inputs.latitude }}
          PHONE_LON: ${{ github.event.inputs.longitude }}
      # Only when manually triggered (the iPhone Shortcut) -- not on the
      # 7am cron schedule, which already gets its own since-midnight map
      # from daily_map.yml. Keeps the automatic morning notifications
      # unchanged while making the one-tap button also send a 24h map.
      - name: Also send a 24h earthquake map (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: python daily_map.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAP_SINCE_HOURS: "24"
          MAP_OUTPUT_NAME: "map_24h.png"
