name: Earthquake Map (last 24h, on demand)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python daily_map.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAP_SINCE_HOURS: "24"
          MAP_OUTPUT_NAME: "map_24h.png"
