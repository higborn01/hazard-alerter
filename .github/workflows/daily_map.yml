name: Daily Hazard Map

on:
  schedule:
    # ~7:05 AM US Eastern, just after the forecast (11:00 UTC). Drifts
    # to 6/7 AM across DST changes, same as daily_forecast.yml.
    - cron: "5 11 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python daily_map.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
