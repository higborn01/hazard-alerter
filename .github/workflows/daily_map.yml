name: Daily Hazard Map

on:
  schedule:
    # ~00:10 US Eastern (drifts to 00:10/23:10 across DST changes)
    - cron: "10 4 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python daily_map.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
