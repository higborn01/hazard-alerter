name: Daily Hazard Map

on:
  schedule:
    # ~7:05 AM US Eastern, just after the forecast (11:00 UTC). Drifts
    # to 6/7 AM across DST changes, same as daily_forecast.yml.
    - cron: "5 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # daily_map.py commits+pushes docs/daily_map.png itself and waits
      # for GitHub Pages to serve it before sending the notification --
      # see commit_and_push_map()/wait_until_live() in the script.
      - run: python daily_map.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
